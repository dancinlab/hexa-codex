# hexa.toml — DRIVE standalone package manifest
#
# Distribution target: hx install ./DRIVE  (local directory)
# Produces a `drive` shim on PATH (~/.hx/bin) that runs drive.hexa.

[package]
name = "drive"
version = "0.1.0"
entry = "drive.hexa"
description = "Model test-drive cart — load a local GGUF on llama-server and chat with it turn-by-turn (multi-turn history). The lightweight counterpart to a full agent TUI: no tools, no file edits, just ask -> answer to feel whether a vertical model can code, do math, etc."
license = "MIT"
authors = ["박민우 <nerve011235@gmail.com>"]
repository = "https://github.com/dancinlab/hexa-codex"
keywords = ["llm", "repl", "chat", "llama-server", "test-drive", "vertical-model", "hexa-family"]
categories = ["ai-research", "cli-tool"]

[[bin]]
name = "drive"
path = "drive.hexa"

[dependencies]
hexa-lang = ">=1.0.0"
